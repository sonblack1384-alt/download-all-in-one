<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Media Downloader</title>
<style>
  :root { --bg:#14171c; --card:#1c212b; --accent:#e8a33d; --text:#edeff2; --muted:#8a93a1; --border:#2a3140; --green:#4caf6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:32px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  textarea { width:100%; min-height:90px; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; font-family:inherit; resize:vertical; }
  .scan-row { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  button { padding:11px 20px; border-radius:8px; border:none; background:var(--accent); color:#14171c; font-weight:600; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.mode-btn { padding:3px 8px; font-size:11px; font-weight:500; border-radius:5px; background:#2a3140; color:var(--muted); }
  button.mode-btn.active { background:var(--accent); color:#14171c; }
  #status { margin:14px 0; color:var(--muted); font-size:14px; min-height:20px; }
  .group { margin-top:22px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .group-head { padding:10px 14px; background:#191d25; display:flex; align-items:center; gap:10px; font-size:13px; }
  .group-head .url { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .badge-nowm { background:var(--green); color:#0c1a10; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .group-error { padding:12px 14px; color:#e8785d; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; padding:12px; }
  .item { position:relative; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--card); cursor:pointer; }
  .item img, .item video { width:100%; height:110px; object-fit:cover; display:block; background:#0d0f13; }
  .item .icon-tile { height:110px; display:flex; align-items:center; justify-content:center; font-size:32px; }
  .item .badge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.65); color:var(--text); font-size:11px; padding:2px 6px; border-radius:4px; }
  .item .mode-toggle { position:absolute; bottom:6px; left:6px; right:6px; display:flex; gap:4px; }
  .item.selected { outline:3px solid var(--accent); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:18px 0 0; }
  .toolbar .left { display:flex; gap:10px; align-items:center; }
  #downloadBar { position:sticky; bottom:0; background:var(--bg); padding:14px 0; margin-top:16px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  a.hidden-link { display:none; }
  .empty { color:var(--muted); font-size:13px; padding:10px 0; }
  .log-panel { margin-top:16px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--card); }
  .log-head { padding:10px 14px; background:#191d25; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .log-head .title { font-size:13px; font-weight:600; }
  .log-head .job-status { font-size:12px; color:var(--muted); }
  .log-head .job-status.running::before { content:"⏳ "; }
  .log-head .job-status.done::before { content:"✅ "; }
  .log-head .job-status.error::before { content:"❌ "; }
  .log-head .job-status.cancelled::before { content:"⛔ "; }
  .log-actions { display:flex; gap:8px; }
  .log-actions button { padding:6px 12px; font-size:12px; }
  .log-list { max-height:240px; overflow-y:auto; padding:10px 14px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.55; }
  .log-line { white-space:pre-wrap; word-break:break-all; color:var(--text); }
  .log-line.err { color:#e8785d; }
  .log-line.ok { color:var(--green); }
  .log-line .n { color:var(--muted); margin-right:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Media Downloader</h1>
  <p class="sub">Dán 1 hoặc nhiều link (mỗi dòng 1 link), quét toàn bộ ảnh/video/audio, chọn và tải hàng loạt về 1 file ZIP. Link TikTok tự động tải bản <b>không watermark</b>. Chỉ dùng cho nội dung bạn có quyền tải.</p>

  <textarea id="urlInput" placeholder="https://...&#10;https://... (có thể dán nhiều link, mỗi dòng 1 cái)"></textarea>
  <div class="scan-row" style="justify-content:space-between;align-items:center">
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="allowPlaylist"> Tải cả playlist/kênh/trang cá nhân nếu link là 1 danh sách (tối đa 30 video)
    </label>
    <button id="scanBtn" onclick="scan()">Quét</button>
  </div>
  <div id="status"></div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="left">
      <button class="secondary" onclick="selectAll(true)">Chọn tất cả</button>
      <button class="secondary" onclick="selectAll(false)">Bỏ chọn</button>
    </div>
    <span id="countLabel" style="color:var(--muted);font-size:13px"></span>
  </div>

  <div id="groups"></div>

  <div id="downloadBar" style="display:none">
    <span id="selectedLabel" style="color:var(--muted);font-size:14px"></span>
    <button id="downloadBtn" onclick="downloadSelected()">Tải ZIP</button>
  </div>

  <div id="logPanel" class="log-panel" style="display:none">
    <div class="log-head">
      <span class="title">Nhật ký tiến trình</span>
      <span id="jobStatus" class="job-status"></span>
      <div class="log-actions">
        <button id="cancelBtn" class="secondary" style="display:none" onclick="cancelJob()">Huỷ</button>
        <button id="retryBtn" class="secondary" style="display:none" onclick="retryJob()">Thử lại</button>
      </div>
    </div>
    <div id="logList" class="log-list"></div>
  </div>
</div>

<script>
let allItems = [];   // {kind: 'image'|'video'|'audio'|'ytdlp', url, mode?: 'video'|'audio'}
let selected = new Set();

function splitUrls() {
  return document.getElementById('urlInput').value
    .split('\n').map(s => s.trim()).filter(Boolean);
}

async function scan() {
  const urls = splitUrls();
  const status = document.getElementById('status');
  const scanBtn = document.getElementById('scanBtn');
  if (urls.length === 0) { status.textContent = 'Nhập ít nhất 1 URL.'; return; }

  status.textContent = `Đang quét ${urls.length} link...`;
  scanBtn.disabled = true;
  document.getElementById('groups').innerHTML = '';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('downloadBar').style.display = 'none';
  allItems = [];
  selected = new Set();

  const allowPlaylist = document.getElementById('allowPlaylist').checked;
  try {
    const res = await fetch('/api/scan_batch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({urls, allow_playlist: allowPlaylist})
    });
    const data = await res.json();
    if (!res.ok) { status.textContent = data.error || 'Lỗi không xác định.'; return; }

    renderGroups(data.results);
    status.textContent = `Quét xong ${data.results.length} link. Chọn file muốn tải rồi bấm "Tải ZIP".`;
  } catch (e) {
    status.textContent = 'Lỗi kết nối: ' + e;
  } finally {
    scanBtn.disabled = false;
  }
}

function makeCard(kind, url, extra) {
  const card = document.createElement('div');
  card.className = 'item selected';
  const idx = allItems.length;
  allItems.push(Object.assign({kind, url}, extra || {}));
  selected.add(idx);
  card.dataset.idx = idx;

  if (kind === 'image') {
    card.innerHTML = `<img src="${url}" loading="lazy" onerror="this.closest('.item').remove()"><span class="badge">ảnh</span>`;
  } else if (kind === 'video') {
    card.innerHTML = `<video src="${url}" muted preload="metadata"></video><span class="badge">video</span>`;
  } else if (kind === 'audio') {
    card.innerHTML = `<div class="icon-tile">🎵</div><span class="badge">audio</span>`;
  } else if (kind === 'ytdlp') {
    const thumb = extra.thumbnail ? `<img src="${extra.thumbnail}" loading="lazy" onerror="this.remove()">` : `<div class="icon-tile">🎬</div>`;
    card.innerHTML = `${thumb}<span class="badge">${extra.title || 'video trang'}</span>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="video">Video</button>
        <button type="button" class="mode-btn" data-mode="audio">MP3</button>
      </div>`;
  } else if (kind === 'douyin') {
    const thumb = extra.thumbnail ? `<img src="${extra.thumbnail}" loading="lazy" onerror="this.remove()">` : `<div class="icon-tile">🥢</div>`;
    card.innerHTML = `${thumb}<span class="badge">Douyin qua trình duyệt</span>`;
  }

  card.addEventListener('click', (e) => {
    if (e.target.classList.contains('mode-btn')) {
      e.stopPropagation();
      allItems[idx].mode = e.target.dataset.mode;
      card.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === e.target));
      return;
    }
    card.classList.toggle('selected');
    if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
    updateCounts();
  });

  return card;
}

function renderGroups(results) {
  const container = document.getElementById('groups');
  container.innerHTML = '';

  results.forEach(r => {
    const group = document.createElement('div');
    group.className = 'group';

    const head = document.createElement('div');
    head.className = 'group-head';
    const titleSuffix = r.title ? ` — ${r.title}` : '';
    let badge = '';
    if (r.source === 'tiktok_no_watermark') badge = '<span class="badge-nowm">✓ Không watermark</span>';
    else if (r.source === 'douyin_browser') badge = '<span class="badge-nowm" style="background:#5aa0e0">⏳ Thử qua trình duyệt lúc tải</span>';
    head.innerHTML = `<span class="url" title="${r.url}">${r.url}${titleSuffix}</span>${badge}`;
    group.appendChild(head);

    if (r.error) {
      const err = document.createElement('div');
      err.className = 'group-error';
      err.textContent = r.error;
      group.appendChild(err);
      container.appendChild(group);
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    (r.images || []).forEach(u => grid.appendChild(makeCard('image', u)));
    (r.videos || []).forEach(u => grid.appendChild(makeCard('video', u)));
    (r.audios || []).forEach(u => grid.appendChild(makeCard('audio', u)));
    (r.ytdlp_videos || []).forEach(v => grid.appendChild(makeCard('ytdlp', v.page_url, {title: v.title, mode: 'video'})));
    (r.douyin_items || []).forEach(v => grid.appendChild(makeCard('douyin', v.page_url, {title: v.title})));
    group.appendChild(grid);
    container.appendChild(group);
  });

  document.getElementById('toolbar').style.display = allItems.length ? 'flex' : 'none';
  document.getElementById('downloadBar').style.display = allItems.length ? 'flex' : 'none';
  updateCounts();
}

function selectAll(on) {
  document.querySelectorAll('.item').forEach(card => {
    card.classList.toggle('selected', on);
    const i = parseInt(card.dataset.idx);
    if (on) selected.add(i); else selected.delete(i);
  });
  updateCounts();
}

function updateCounts() {
  document.getElementById('countLabel').textContent = `${allItems.length} file tìm thấy`;
  document.getElementById('selectedLabel').textContent = `Đã chọn ${selected.size} file`;
}

let currentJobId = null;
let pollTimer = null;
let lastPayload = null;
let shownLogCount = 0;

function setJobStatusLabel(status) {
  const el = document.getElementById('jobStatus');
  el.className = 'job-status ' + status;
  const labels = {running: 'Đang chạy...', done: 'Hoàn tất', error: 'Lỗi', cancelled: 'Đã huỷ'};
  el.textContent = labels[status] || status;
}

function appendLogLines(logs) {
  const list = document.getElementById('logList');
  for (let i = shownLogCount; i < logs.length; i++) {
    const row = document.createElement('div');
    const line = logs[i];
    const isErr = /lỗi|error|thất bại/i.test(line);
    const isOk = /xong|hoàn tất|hoàn thành/i.test(line) && !isErr;
    row.className = 'log-line' + (isErr ? ' err' : isOk ? ' ok' : '');
    row.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span>${line.replace(/</g, '&lt;')}`;
    list.appendChild(row);
  }
  shownLogCount = logs.length;
  list.scrollTop = list.scrollHeight;
}

async function startDownloadJob(urls, ytdlpItems, douyinItems) {
  lastPayload = {urls, ytdlp_items: ytdlpItems, douyin_items: douyinItems};
  shownLogCount = 0;
  document.getElementById('logList').innerHTML = '';
  document.getElementById('logPanel').style.display = 'block';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  document.getElementById('retryBtn').style.display = 'none';
  setJobStatusLabel('running');

  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = 'Đang tải...';

  try {
    const res = await fetch('/api/download/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(lastPayload)
    });
    const data = await res.json();
    if (!res.ok) {
      appendLogLines([data.error || 'Không tạo được tiến trình tải.']);
      setJobStatusLabel('error');
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'inline-block';
      btn.disabled = false;
      btn.textContent = 'Tải ZIP';
      return;
    }
    currentJobId = data.job_id;
    pollTimer = setInterval(() => pollJobStatus(currentJobId), 1000);
  } catch (e) {
    appendLogLines(['Lỗi kết nối: ' + e]);
    setJobStatusLabel('error');
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('retryBtn').style.display = 'inline-block';
    btn.disabled = false;
    btn.textContent = 'Tải ZIP';
  }
}

async function pollJobStatus(jobId) {
  const btn = document.getElementById('downloadBtn');
  try {
    const res = await fetch(`/api/download/status/${jobId}`);
    if (!res.ok) {
      clearInterval(pollTimer);
      appendLogLines(['Không tìm thấy tiến trình (có thể server đã khởi động lại).']);
      setJobStatusLabel('error');
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'inline-block';
      btn.disabled = false;
      btn.textContent = 'Tải ZIP';
      return;
    }
    const data = await res.json();
    appendLogLines(data.logs || []);

    if (data.status === 'running') return;

    clearInterval(pollTimer);
    setJobStatusLabel(data.status);
    document.getElementById('cancelBtn').style.display = 'none';
    btn.disabled = false;
    btn.textContent = 'Tải ZIP';

    if (data.status === 'done') {
      window.location.href = `/api/download/result/${jobId}`;
    } else {
      document.getElementById('retryBtn').style.display = 'inline-block';
    }
  } catch (e) {
    clearInterval(pollTimer);
    appendLogLines(['Lỗi khi kiểm tra tiến trình: ' + e]);
    setJobStatusLabel('error');
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('retryBtn').style.display = 'inline-block';
    btn.disabled = false;
    btn.textContent = 'Tải ZIP';
  }
}

async function cancelJob() {
  if (!currentJobId) return;
  document.getElementById('cancelBtn').disabled = true;
  try {
    await fetch(`/api/download/cancel/${currentJobId}`, {method: 'POST'});
  } catch (e) { /* vẫn chờ poll tiếp theo cập nhật trạng thái */ }
  document.getElementById('cancelBtn').disabled = false;
}

function retryJob() {
  if (!lastPayload) return;
  startDownloadJob(lastPayload.urls, lastPayload.ytdlp_items, lastPayload.douyin_items);
}

function downloadSelected() {
  const urls = [];
  const ytdlpItems = [];
  const douyinItems = [];
  selected.forEach(i => {
    const item = allItems[i];
    if (item.kind === 'ytdlp') {
      ytdlpItems.push({page_url: item.url, title: item.title, mode: item.mode || 'video'});
    } else if (item.kind === 'douyin') {
      douyinItems.push({page_url: item.url, title: item.title});
    } else {
      urls.push(item.url);
    }
  });
  if (urls.length === 0 && ytdlpItems.length === 0 && douyinItems.length === 0) { alert('Chưa chọn file nào.'); return; }
  if (douyinItems.length > 0) {
    document.getElementById('status').textContent = 'Đang tải Douyin qua trình duyệt thật -- xem chi tiết từng bước ở bảng Nhật ký tiến trình bên dưới.';
  }
  startDownloadJob(urls, ytdlpItems, douyinItems);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) scan();
});
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Media Downloader</title>
<style>
  :root { --bg:#14171c; --card:#1c212b; --accent:#e8a33d; --text:#edeff2; --muted:#8a93a1; --border:#2a3140; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:32px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .scan-row { display:flex; gap:8px; }
  input[type=url] { flex:1; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px; }
  button { padding:12px 20px; border-radius:8px; border:none; background:var(--accent); color:#14171c; font-weight:600; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
  #status { margin:16px 0; color:var(--muted); font-size:14px; min-height:20px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:20px 0 10px; }
  .toolbar .left { display:flex; gap:10px; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .item { position:relative; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--card); cursor:pointer; }
  .item img, .item video { width:100%; height:110px; object-fit:cover; display:block; background:#0d0f13; }
  .item .badge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.6); color:var(--text); font-size:11px; padding:2px 6px; border-radius:4px; }
  .item .check { position:absolute; top:6px; right:6px; width:18px; height:18px; }
  .item.selected { outline:3px solid var(--accent); }
  #downloadBar { position:sticky; bottom:0; background:var(--bg); padding:14px 0; margin-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  a.hidden-link { display:none; }
  .empty { color:var(--muted); font-size:14px; padding:40px 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bulk Media Downloader</h1>
  <p class="sub">Dán link 1 trang web bất kỳ, quét toàn bộ ảnh/video trên trang, chọn và tải hàng loạt về dạng ZIP. Chỉ dùng cho nội dung bạn có quyền tải.</p>

  <div class="scan-row">
    <input type="url" id="urlInput" placeholder="https://..." autofocus>
    <button id="scanBtn" onclick="scan()">Quét trang</button>
  </div>
  <div id="status"></div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="left">
      <button class="secondary" onclick="selectAll(true)">Chọn tất cả</button>
      <button class="secondary" onclick="selectAll(false)">Bỏ chọn</button>
      <span id="countLabel" style="color:var(--muted);font-size:13px"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div id="downloadBar" style="display:none">
    <span id="selectedLabel" style="color:var(--muted);font-size:14px"></span>
    <button id="downloadBtn" onclick="downloadSelected()">Tải ZIP</button>
  </div>
</div>

<script>
let mediaItems = [];     // {url, kind}
let selected = new Set();
let ytdlpVideo = null;

async function scan() {
  const url = document.getElementById('urlInput').value.trim();
  const status = document.getElementById('status');
  const scanBtn = document.getElementById('scanBtn');
  if (!url) { status.textContent = 'Nhập URL trước đã.'; return; }

  status.textContent = 'Đang quét trang...';
  scanBtn.disabled = true;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('downloadBar').style.display = 'none';
  selected = new Set();
  ytdlpVideo = null;

  try {
    const res = await fetch('/api/scan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if (!res.ok) { status.textContent = data.error || 'Lỗi không xác định.'; return; }

    mediaItems = [
      ...data.images.map(u => ({url: u, kind: 'image'})),
      ...data.videos.map(u => ({url: u, kind: 'video'})),
    ];
    ytdlpVideo = data.ytdlp_video || null;

    let extra = ytdlpVideo ? 1 : 0;
    status.textContent = `Tìm thấy ${mediaItems.length + extra} file. Chọn file muốn tải rồi bấm "Tải ZIP".`;
    renderGrid();
  } catch (e) {
    status.textContent = 'Lỗi kết nối: ' + e;
  } finally {
    scanBtn.disabled = false;
  }
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (ytdlpVideo) {
    const card = document.createElement('div');
    card.className = 'item selected';
    card.dataset.special = 'ytdlp';
    card.innerHTML = `<div style="height:110px;display:flex;align-items:center;justify-content:center;font-size:32px">🎬</div>
                       <span class="badge">video trang (${ytdlpVideo.title})</span>`;
    card.onclick = () => { card.classList.toggle('selected'); updateCounts(); };
    grid.appendChild(card);
  }

  mediaItems.forEach((item, i) => {
    selected.add(i); // mặc định chọn hết, bỏ chọn thủ công nếu không muốn
    const card = document.createElement('div');
    card.className = 'item selected';
    card.dataset.index = i;
    const media = item.kind === 'image'
      ? `<img src="${item.url}" loading="lazy" onerror="this.closest('.item').remove()">`
      : `<video src="${item.url}" muted preload="metadata"></video>`;
    card.innerHTML = `${media}<span class="badge">${item.kind}</span>`;
    card.onclick = () => {
      card.classList.toggle('selected');
      if (selected.has(i)) selected.delete(i); else selected.add(i);
      updateCounts();
    };
    grid.appendChild(card);
  });

  if (mediaItems.length === 0 && !ytdlpVideo) {
    grid.innerHTML = '<div class="empty">Không tìm thấy ảnh/video nào.</div>';
  }

  document.getElementById('toolbar').style.display = mediaItems.length ? 'flex' : 'none';
  document.getElementById('downloadBar').style.display = 'flex';
  updateCounts();
}

function selectAll(on) {
  document.querySelectorAll('.item').forEach(card => {
    card.classList.toggle('selected', on);
    if (card.dataset.index !== undefined) {
      const i = parseInt(card.dataset.index);
      if (on) selected.add(i); else selected.delete(i);
    }
  });
  updateCounts();
}

function updateCounts() {
  const n = selected.size + (document.querySelector('.item[data-special="ytdlp"].selected') ? 1 : 0);
  document.getElementById('countLabel').textContent = `${mediaItems.length} file tìm thấy`;
  document.getElementById('selectedLabel').textContent = `Đã chọn ${n} file`;
}

async function downloadSelected() {
  const urls = [...selected].map(i => mediaItems[i].url);
  const wantYtdlp = !!document.querySelector('.item[data-special="ytdlp"].selected');
  if (urls.length === 0 && !wantYtdlp) { alert('Chưa chọn file nào.'); return; }

  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = 'Đang tải...';
  try {
    const res = await fetch('/api/download', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({urls, ytdlp_video: wantYtdlp ? ytdlpVideo : null})
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Tải thất bại.');
      return;
    }
    const blob = await res.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'media.zip';
    link.className = 'hidden-link';
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (e) {
    alert('Lỗi: ' + e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Tải ZIP';
  }
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') scan();
});
</script>
</body>
</html>
